<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Kiro</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
        user-select: none;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        font-family: system-ui, sans-serif;
        color: #f5f0ff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
      }
      #ui .screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      #ui .screen[hidden] {
        display: none;
      }
      #ui .screen-hud {
        justify-content: flex-start;
        padding-top: 1rem;
      }
      #ui .score {
        font-size: 2rem;
        margin: 0;
      }
      #ui .screen-paused,
      #ui .screen-gameover,
      #ui .screen-title {
        background: rgba(10, 5, 20, 0.6);
      }
      #ui .mute-button {
        position: absolute;
        top: 1rem;
        right: 1rem;
        pointer-events: auto;
        touch-action: none;
        font: inherit;
        color: #f5f0ff;
        background: rgba(10, 5, 20, 0.8);
        border: 1px solid #f5f0ff;
        border-radius: 0.5rem;
        padding: 0.5rem 0.75rem;
        cursor: pointer;
      }
      #ui .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
